name: Browser tool · Check and publish
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forecastreceipt-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.preserve.outputs.revision }}
      slot: ${{ steps.capture.outputs.slot }}
      openweather: ${{ steps.capture.outputs.openweather }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Capture forecasts and reconcile station readings
        id: capture
        env:
          COOLCODE_OPENWEATHER_API_KEY: ${{ secrets.COOLCODE_OPENWEATHER_API_KEY }}
        run: python3 scripts/collect.py
      - name: Validate and preserve archive
        id: preserve
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/build.py
          git add web/data/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Save prospective forecast receipts and station readings"
            git push origin HEAD:main
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  monitor:
    needs: collect
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        if: needs.collect.result == 'success'
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the saved six-hour window on main
        id: verify
        if: needs.collect.result == 'success'
        env:
          SLOT: ${{ needs.collect.outputs.slot }}
          REVISION: ${{ needs.collect.outputs.revision }}
          OPENWEATHER: ${{ needs.collect.outputs.openweather }}
        run: |
          git merge-base --is-ancestor "$REVISION" HEAD
          flags=()
          if [[ "$OPENWEATHER" == true ]]; then flags+=(--openweather); fi
          python3 scripts/verify_window.py "$SLOT" "$REVISION" "${flags[@]}"
      - name: Report collector result to Healthchecks.io
        if: always()
        env:
          PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
          VERIFIED: ${{ needs.collect.result == 'success' && steps.verify.outcome == 'success' }}
        run: |
          if [[ -z "$PING_URL" ]]; then
            echo 'Healthchecks.io is inactive. Set HEALTHCHECKS_PING_URL to enable missed-run alerts.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          suffix=/fail
          if [[ "$VERIFIED" == true ]]; then suffix=''; fi
          curl --disable --silent --fail --output /dev/null --max-time 12 --retry 2 --retry-all-errors \
            --request POST "${PING_URL%/}$suffix" || { echo 'Healthchecks.io did not acknowledge the ping.'; exit 1; }
          echo "Healthchecks.io acknowledged the collector result (verified=$VERIFIED)." >> "$GITHUB_STEP_SUMMARY"
  build:
    needs: collect
    if: always() && (needs.collect.result == 'success' || needs.collect.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      publish: ${{ steps.identity.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.collect.outputs.revision || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test the application
        run: node --test tests/*.test.mjs
      - name: Test the builder
        run: python3 -m unittest discover -s tests -v
      - name: Build the static application
        run: python3 scripts/build.py
      - name: Check whether the tool has been initialized
        id: identity
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          python3 - <<'PY'
          import json, os
          tool_id = json.load(open('tool.json'))['id']
          ready = tool_id != 'coolcode-tool-template' and tool_id == os.environ['REPOSITORY_NAME']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'publish={str(ready).lower()}\n')
          PY
      - name: Install browser test dependencies
        run: |
          python3 -m pip install -r tests/browser-requirements.txt
          python3 -m playwright install --with-deps chromium
      - name: Check application in a browser
        run: python3 tests/browser_smoke.py
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: browser-checks/
          retention-days: 7
      - name: Save reviewable site
        uses: actions/upload-artifact@v4
        with:
          name: browser-tool-preview
          path: dist/
          include-hidden-files: true
          retention-days: 7
      - name: Package Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.identity.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    if: always() && needs.build.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: publish
